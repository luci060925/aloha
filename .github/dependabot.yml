version: 2
updates:
  # Avisa (con un pedido de cambio) cuando hay versiones nuevas o parches de seguridad
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      desarrollo:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
